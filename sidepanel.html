<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Notes</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <header class="header">
    <span class="header-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Quick Notes
    </span>
    <div class="header-actions">
      <button id="btn-theme" class="icon-btn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- ── Toolbar ─────────────────────────────────────────────────── -->
  <div class="toolbar">

    <!-- Note tabs — click to switch between notes -->
    <div class="note-tabs" id="note-tabs">
      <!-- Dynamically generated by sidepanel.js -->
    </div>
    <button id="btn-new-note" class="icon-btn new-note-btn" title="New note">＋</button>

  </div>

  <!-- ── Formatting Bar ──────────────────────────────────────────── -->
  <div class="format-bar">
    <button class="fmt-btn" id="fmt-bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
    <button class="fmt-btn" id="fmt-italic" title="Italic (Ctrl+I)"><em>I</em></button>
    <button class="fmt-btn" id="fmt-underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <div class="separator"></div>
    <button class="fmt-btn" id="fmt-bullet" title="Bullet list">• List</button>
    <button class="fmt-btn" id="fmt-heading" title="Heading"># H</button>
    <div class="separator"></div>
    <button class="fmt-btn" id="btn-copy" title="Copy all">📋</button>
    <button class="fmt-btn danger" id="btn-clear" title="Clear note">🗑️</button>
  </div>

  <!-- ── Editor ──────────────────────────────────────────────────── -->
  <div class="editor-wrapper">
    <textarea
      id="notes-editor"
      class="editor"
      placeholder="Start typing your notes here...

Tips:
• Alt+N to open/close this panel
• Your notes are saved automatically
• Click ＋ to create a new note"
      spellcheck="true"
      autofocus
    ></textarea>
  </div>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <footer class="footer">
    <span id="status-msg" class="status-msg"></span>
    <span id="char-count" class="char-count">0 chars</span>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
